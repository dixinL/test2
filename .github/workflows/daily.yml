name: 个股右侧判定
on:
  push:
    branches: [main]
  schedule:
    # 北京时间每天早上5点 = UTC 21:00（前一天），晚于 test1 的 3:00 环境快照，留 2 小时余量
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rightside:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install baostock certifi

      - name: 刷新基础数据（baostock：个股日线+因子+近两季财报+上证指数）
        working-directory: general-data
        run: python refresh.py

      - name: 拉取 test1 环境快照（增量）
        working-directory: general-data
        run: python envfetch.py

      - name: 右侧判定
        working-directory: rightside
        run: python run.py

      - name: 生成总览并分发（RSS + WxPusher 推送）
        working-directory: analysis-hub
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
        run: python run.py

      - name: 提交报告
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rightside/report/ analysis-hub/report/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: 右侧判定报告 $(date +%Y-%m-%d)"
            git push
          fi
